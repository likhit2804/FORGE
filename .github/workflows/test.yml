name: MVP validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[geo,rainfall]" -r requirements.txt

      - name: Validate event provenance and source manifest
        run: python scripts/validate_events.py

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python files
        run: python -m compileall -q app.py src scripts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Build frontend
        run: npm --prefix web run build
