[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monsoon-impact-navigator"
version = "0.1.0"
description = "Explainable historical-analogue rainfall impact prioritisation for Tamil Nadu"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
geo = ["shapely>=2.0,<3"]
rainfall = ["xarray>=2024.1", "netCDF4>=1.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
